<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopEase Support Assistant</title>
  <meta name="description" content="FAQ chatbot that answers customer questions using NLP and cosine similarity.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="chat" aria-label="ShopEase support chat">
    <header class="chat__header">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">S</span>
        <div>
          <h1 class="brand__name">ShopEase Support</h1>
          <p class="brand__status"><span class="dot" aria-hidden="true"></span>Answers from our FAQ, instantly</p>
        </div>
      </div>
      <button class="btn-clear" id="clearBtn" type="button">Clear chat</button>
    </header>

    <section class="chat__log" id="log" role="log" aria-live="polite" aria-label="Conversation"></section>

    <div class="chips" id="chips" aria-label="Suggested questions"></div>

    <form class="composer" id="form" autocomplete="off">
      <label class="sr-only" for="input">Your question</label>
      <input class="composer__input" id="input" type="text" maxlength="500"
             placeholder="Ask about orders, shipping, returns, payments..." required>
      <button class="composer__send" type="submit" aria-label="Send message">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
      </button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
